<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Pooti Accounting</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    padding: 20px 16px 40px;
    max-width: 480px;
    margin-inline: auto;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #666; margin: 0 0 20px; }
  form { display: flex; flex-direction: column; gap: 16px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-size: 12px; color: #888; font-weight: 400; }
  input, textarea, select {
    width: 100%;
    min-width: 0;
    font-size: 16px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
  }
  /* iOS/Android render the native date-picker's internal segments with their
     own minimum width — without this the input can force the page wider than
     the viewport instead of shrinking to fit. */
  input[type="date"] { -webkit-appearance: none; appearance: none; }
  textarea { resize: vertical; min-height: 60px; }
  button {
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #06c755;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #aaa; }
  #status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  #status.success { display: block; background: #e6f7ed; color: #0a7a3d; }
  #status.error { display: block; background: #fdecea; color: #b3261e; }
  .invalid { border-color: #b3261e !important; border-width: 2px !important; }

  #items { display: flex; flex-direction: column; gap: 10px; }
  .item-row {
    display: grid;
    grid-template-columns: minmax(0, 84px) minmax(0, 1fr) minmax(0, 80px) minmax(0, 28px);
    gap: 6px;
    align-items: center;
    background: #fff;
    padding: 8px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
  }
  .item-row select, .item-row input { padding: 10px 6px; font-size: 14px; }
  .item-row .item-type {
    font-weight: 600;
    border-width: 2px;
  }
  .item-row .item-type.type-income { background: #e6f7ed; color: #0a7a3d; border-color: #0a7a3d; }
  .item-row .item-type.type-outcome { background: #fdecea; color: #b3261e; border-color: #b3261e; }
  .item-row .remove-row {
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 6px;
    background: #fdecea;
    color: #b3261e;
    font-size: 18px;
    line-height: 1;
  }
  @media (max-width: 360px) {
    .item-row { grid-template-columns: minmax(0, 1fr) minmax(0, 26px); grid-template-areas: "type remove" "name name" "price price"; row-gap: 6px; }
    .item-row .item-type { grid-area: type; }
    .item-row .remove-row { grid-area: remove; }
    .item-row .item-name { grid-area: name; }
    .item-row .item-price { grid-area: price; }
  }
  #add-row-btn {
    background: #fff;
    color: #06c755;
    border: 1px dashed #06c755;
  }
  #attach-image-btn {
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #ccc;
  }
  #image-preview-wrap { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  #image-preview { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid #e0e0e0; }
  #remove-image-btn {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    background: #fdecea;
    color: #b3261e;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <h1>ส่งรายงานประจำวัน</h1>
  <p class="subtitle">Daily income/expense report — Pooti Accounting</p>

  <form id="entry-form">
    <div>
      <label for="branch_code">สาขา / Branch</label>
      <select id="branch_code" required disabled>
        <option value="">กำลังโหลด... / Loading...</option>
      </select>
    </div>
    <div>
      <label for="business_date">วันที่ / Date</label>
      <input type="date" id="business_date" required />
    </div>

    <div>
      <label>รายการ / Items</label>
      <div id="items"></div>
    </div>

    <button type="button" id="add-row-btn">+ เพิ่มรายการ / Add row</button>

    <div id="image-attach-section">
      <label for="receipt_image">แนบรูปใบเสร็จ / Attach receipt photo <span class="hint">(optional)</span></label>
      <input type="file" id="receipt_image" accept="image/*" capture="environment" hidden />
      <button type="button" id="attach-image-btn">📷 แนบรูป / Attach photo</button>
      <div id="image-preview-wrap" hidden>
        <img id="image-preview" alt="Receipt preview" />
        <button type="button" id="remove-image-btn">ลบรูป / Remove photo</button>
      </div>
    </div>

    <div>
      <label for="notes">หมายเหตุ / Notes <span class="hint">(optional)</span></label>
      <textarea id="notes"></textarea>
    </div>
    <button type="submit" id="submit-btn">บันทึก / Submit</button>
  </form>

  <div id="status"></div>

<script>
  // Replaced with the real LIFF ID after registering the LIFF app in LINE console.
  const LIFF_ID = '2011133020-xLcCRZfd';
  const API_BASE_URL = 'https://pooti-accounting-backend-740865262642.asia-southeast1.run.app';
  const STARTING_ROWS = 3;

  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');
  const dateInput = document.getElementById('business_date');
  const branchSelect = document.getElementById('branch_code');
  const itemsEl = document.getElementById('items');
  const addRowBtn = document.getElementById('add-row-btn');
  const imageInput = document.getElementById('receipt_image');
  const attachImageBtn = document.getElementById('attach-image-btn');
  const imagePreviewWrap = document.getElementById('image-preview-wrap');
  const imagePreview = document.getElementById('image-preview');
  const removeImageBtn = document.getElementById('remove-image-btn');
  let compressedImage = null;

  function clearImage() {
    compressedImage = null;
    imageInput.value = '';
    imagePreviewWrap.hidden = true;
    attachImageBtn.hidden = false;
  }

  attachImageBtn.addEventListener('click', () => imageInput.click());
  branchSelect.addEventListener('change', () => branchSelect.classList.remove('invalid'));

  // Resizes to at most 1200px on the longest side and re-encodes as JPEG —
  // a raw phone photo (2-5MB) has no accounting value over a ~100-300KB
  // compressed one, and this keeps both upload time and Storage cost down.
  function compressImage(file, maxDim = 1200, quality = 0.68) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ / could not read file'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('เปิดรูปไม่สำเร็จ / could not decode image'));
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height >= width && height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  imageInput.addEventListener('change', async () => {
    const file = imageInput.files[0];
    if (!file) return;
    try {
      compressedImage = await compressImage(file);
      imagePreview.src = compressedImage;
      imagePreviewWrap.hidden = false;
      attachImageBtn.hidden = true;
    } catch (err) {
      showStatus('error', 'แนบรูปไม่สำเร็จ / Could not attach photo: ' + err.message);
      clearImage();
    }
  });

  removeImageBtn.addEventListener('click', clearImage);
  function todayInBangkok() {
    // Stores are always physically in Thailand — use the Bangkok calendar
    // date explicitly rather than the device's local time/timezone, which
    // toISOString() (UTC) or a misconfigured phone clock would get wrong.
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
  }

  dateInput.value = todayInBangkok();

  async function loadFeatureFlags() {
    try {
      const res = await fetch(`${API_BASE_URL}/feature-flags`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const flags = await res.json();
      document.getElementById('image-attach-section').hidden = !flags.image_attach;
    } catch (err) {
      // Fails safe by hiding the feature rather than blocking the whole form.
      document.getElementById('image-attach-section').hidden = true;
    }
  }

  async function loadBranches() {
    try {
      const res = await fetch(`${API_BASE_URL}/branches`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const branches = await res.json();

      if (!Array.isArray(branches) || branches.length === 0) {
        throw new Error('No branches configured');
      }

      branchSelect.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'เลือกสาขา / Select branch';
      placeholder.disabled = true;
      placeholder.selected = true;
      branchSelect.appendChild(placeholder);
      for (const b of branches) {
        const opt = document.createElement('option');
        opt.value = b.branchCode;
        opt.textContent = b.branchName;
        branchSelect.appendChild(opt);
      }
      branchSelect.disabled = false;
    } catch (err) {
      branchSelect.innerHTML = '<option value="">โหลดสาขาไม่สำเร็จ / Failed to load branches</option>';
      showStatus('error', 'โหลดรายชื่อสาขาไม่สำเร็จ / Could not load branches: ' + err.message);
      submitBtn.disabled = true;
    }
  }

  function updateTypeColor(select) {
    select.classList.toggle('type-income', select.value === 'income');
    select.classList.toggle('type-outcome', select.value === 'outcome');
  }

  function addItemRow() {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <select class="item-type">
        <option value="income">รายรับ</option>
        <option value="outcome">รายจ่าย</option>
      </select>
      <input type="text" class="item-name" placeholder="ชื่อรายการ / Name" />
      <input type="number" class="item-price" placeholder="ราคา / Price" inputmode="decimal" min="0" step="0.01" />
      <button type="button" class="remove-row" aria-label="Remove row">×</button>
    `;
    row.querySelector('.remove-row').addEventListener('click', () => row.remove());
    const typeSelect = row.querySelector('.item-type');
    typeSelect.addEventListener('change', () => updateTypeColor(typeSelect));
    updateTypeColor(typeSelect);
    itemsEl.appendChild(row);
  }

  addRowBtn.addEventListener('click', addItemRow);
  for (let i = 0; i < STARTING_ROWS; i++) addItemRow();

  function showStatus(kind, text) {
    statusEl.className = kind;
    statusEl.textContent = text;
  }

  function generateIdempotencyKey() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'idk-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function collectItems() {
    return Array.from(itemsEl.querySelectorAll('.item-row'))
      .map((row) => ({
        type: row.querySelector('.item-type').value,
        name: row.querySelector('.item-name').value.trim(),
        price: Number(row.querySelector('.item-price').value),
      }))
      // A row left completely blank (no name typed, no price entered) is just
      // an unused extra slot from the starting 3 — not a validation error.
      .filter((item) => item.name !== '' || (!Number.isNaN(item.price) && item.price !== 0));
  }

  async function init() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      await Promise.all([loadBranches(), loadFeatureFlags()]);
    } catch (err) {
      showStatus('error', 'เปิดผ่านแอป LINE เท่านั้น / Please open this from the LINE app. (' + err.message + ')');
      submitBtn.disabled = true;
    }
  }

  document.getElementById('entry-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!branchSelect.value) {
      branchSelect.classList.add('invalid');
      showStatus('error', 'กรุณาเลือกสาขา / Please select a branch.');
      branchSelect.focus();
      return;
    }
    branchSelect.classList.remove('invalid');

    const items = collectItems();
    if (items.length === 0) {
      showStatus('error', 'กรุณากรอกอย่างน้อย 1 รายการ / Please fill in at least one item.');
      return;
    }
    const invalid = items.find((item) => !item.name || !(item.price > 0));
    if (invalid) {
      showStatus('error', 'แต่ละรายการต้องมีชื่อและราคามากกว่า 0 / Every item needs a name and a price greater than 0.');
      return;
    }

    submitBtn.disabled = true;
    showStatus('success', 'กำลังบันทึก... / Submitting...');

    const payload = {
      idToken: liff.getIDToken(),
      businessDate: dateInput.value,
      branchCode: branchSelect.value,
      branchName: branchSelect.selectedOptions[0].textContent,
      items,
      notes: document.getElementById('notes').value,
      idempotencyKey: generateIdempotencyKey(),
    };
    if (compressedImage) payload.imageBase64 = compressedImage;

    try {
      const res = await fetch(`${API_BASE_URL}/submissions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.message || `HTTP ${res.status}`);
      }

      const result = await res.json();
      showStatus(
        'success',
        `บันทึกสำเร็จ / Saved: ${result.branchName ?? ''} รายรับ ${result.incomeAmount.toLocaleString()} รายจ่าย ${result.expenseAmount.toLocaleString()}`
      );
      document.getElementById('entry-form').reset();
      dateInput.value = todayInBangkok();
      itemsEl.innerHTML = '';
      for (let i = 0; i < STARTING_ROWS; i++) addItemRow();
      clearImage();
    } catch (err) {
      showStatus('error', 'บันทึกไม่สำเร็จ / Failed: ' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  init();
</script>
</body>
</html>
